name: code_graph
description: Code map model (code graph + 3D placement) and its flutter_scene .fscene codec, for dart_code_3D.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  equatable: ^2.0.7
  meta: ^1.16.0
  # The .fscene document model, from hawkbee's flutter_scene submodule.
  scene:
    path: ../flutter_scene/packages/scene
  vector_math: ^2.1.4

dev_dependencies:
  mocktail: ^1.0.5
  test: ^1.32.0
  very_good_analysis: ^11.0.0
